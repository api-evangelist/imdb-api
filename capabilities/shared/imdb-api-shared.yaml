apiVersion: naftiko.dev/v1alpha1
kind: SharedCapabilityBundle
metadata:
  name: imdb-api-shared
  description: Shared capability primitives for the IMDb-API (TV-API) service.
spec:
  provider:
    id: imdb-api
    name: IMDb-API (TV-API)
    baseUrl: https://tv-api.com
    authentication:
      type: apiKey
      placement: path
      name: apiKey
  capabilities:
    - id: imdb-api.search
      title: Search IMDb-API
      description: Free-text search across titles, names, episodes, companies and keywords.
      method: GET
      pathTemplate: /{lang}/API/Search/{apiKey}/{expression}
      inputs: [lang, apiKey, expression]
      governance:
        readOnly: true
        quotaImpact: 1
    - id: imdb-api.getTitle
      title: Get Title
      description: Retrieve full title metadata by IMDb id.
      method: GET
      pathTemplate: /{lang}/API/Title/{apiKey}/{id}
      inputs: [lang, apiKey, id]
      governance:
        readOnly: true
        quotaImpact: 1
    - id: imdb-api.getRatings
      title: Get Aggregated Ratings
      description: Retrieve IMDb, Metacritic, Rotten Tomatoes, TMDB and FilmAffinity ratings.
      method: GET
      pathTemplate: /{lang}/API/Ratings/{apiKey}/{id}
      inputs: [lang, apiKey, id]
      governance:
        readOnly: true
        quotaImpact: 1
    - id: imdb-api.getFullCast
      title: Get Full Cast And Crew
      method: GET
      pathTemplate: /{lang}/API/FullCast/{apiKey}/{id}
      inputs: [lang, apiKey, id]
      governance:
        readOnly: true
        quotaImpact: 1
    - id: imdb-api.getName
      title: Get Person
      method: GET
      pathTemplate: /{lang}/API/Name/{apiKey}/{id}
      inputs: [lang, apiKey, id]
      governance:
        readOnly: true
        quotaImpact: 1
    - id: imdb-api.getTop250Movies
      title: Get Top 250 Movies
      method: GET
      pathTemplate: /{lang}/API/Top250Movies/{apiKey}
      inputs: [lang, apiKey]
      governance:
        readOnly: true
        quotaImpact: 1
    - id: imdb-api.getUsage
      title: Get Account Usage
      method: GET
      pathTemplate: /API/Usage/{apiKey}
      inputs: [apiKey]
      governance:
        readOnly: true
        quotaImpact: 0
