aid: imdb-api
name: IMDb-API
description: >-
  Community web service (operated under the IMDb-API / TV-API brand) providing
  movie, TV series and cast information in JSON. Aggregates data from IMDb,
  TheMovieDb, Wikipedia, Rotten Tomatoes, Metacritic, TheTVDB, FilmAffinity and
  YouTube. Originally hosted at imdb-api.com and migrated to tv-api.com. Operated
  by the IMDb-API GitHub user (open source C# client library and Windows client
  app). NOT an official IMDb / Amazon product — IMDb itself does not expose a
  public API; community scrapers such as this one (alongside OMDb, TMDB and
  Apify's IMDb scraper) fill the gap.
