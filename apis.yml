apis:
  - name: IMDb-API
    description: >-
      REST JSON web service for movie, TV series, cast, ratings, images,
      trailers, lists and box office data. 30+ endpoints organized into Search,
      Title, Name, Lists, External and Tools categories. API key required;
      embedded in the request path. Originally documented at imdb-api.com and
      now served from tv-api.com.
